*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;transition:transform 1s}

main{max-width:520px;margin:0 auto;padding:12px}

h1{font-size:20px;margin:0;text-transform:capitalize}

.nav{display:flex;gap:6px}

.wd{text-align:center;font-size:12px;color:var(--mu);padding:4px 0}
.d{aspect-ratio:1/1.1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;font-size:13px;position:relative;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
.d.h{background:var(--hol);border-color:var(--ac)}
.d.t{outline:2px solid var(--ac)}
.d.o{opacity:.35}
.d .e{font-size:20px;text-align:center;margin:auto 0}
.d i{position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.legend{font-size:12px;color:var(--mu);margin:10px 2px}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.on{display:flex}
.sh{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sh h2{margin:0 0 4px;font-size:20px}.sh .dt{color:var(--mu);font-size:13px}
.sh .big{font-size:42px}.sh p{margin:8px 0}
.ev{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
.row{display:flex;gap:6px;margin-top:10px}
input{flex:1;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
.d.sp{background:var(--card);border:1px dashed var(--ac)}
.fx.spin{top:32%;left:calc(50% - 60px);font-size:120px;animation:spin 2.4s ease-out forwards}
@keyframes spin{from{transform:scale(0) rotate(0)}60%{transform:scale(1.2) rotate(720deg)}to{transform:scale(0) rotate(1080deg);opacity:0}}
body.shk{animation:shk .15s 20}@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
body.rb{animation:rb 3s}@keyframes rb{to{filter:hue-rotate(360deg)}}
.fx{position:fixed;pointer-events:none;z-index:9;font-size:28px;animation:fall 4s linear forwards}
.fx.rise{animation-name:rise}.fx.burst{animation-name:burst;top:45%;left:50%}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(112vh) rotate(360deg)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes burst{from{transform:translate(0,0) scale(.3);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}
